name: V5 Preflight

on:
  push:
    branches:
      - v5-private-data-architecture
      - v5-1-exam-index
      - v5-1-1-ux
      - v5-1-1-version-fix
      - v5-2-health-panorama
      - v5-2-1-calmer-health-status
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in core-v5.js crypto-v5.js charts-v5.js render-v5.js v51.js v52.js ui-v5.js crypto-ui-v5.js sw-v5.js; do
            test -f "$f"
            node --check "$f"
          done

      - name: Privacy invariants
        run: |
          set -euo pipefail
          test ! -e core.js
          test ! -e core-v3.js
          test ! -e health-recovery-key-v5.json
          ! grep -R -n --exclude='health-data-v5.enc.json' --exclude='v5_preflight.yml' -E '287[.]364[.]238|ANDERSON ANDRE PSCHEIDT|BUNDLED_HEALTH_DATA|iCloud Drive[[:space:]]*[›/][[:space:]]*Medicina' .

      - name: Encrypted dataset contract
        run: |
          python - <<'PY'
          import base64, json, pathlib
          enc=json.loads(pathlib.Path('health-data-v5.enc.json').read_text())
          pub=json.loads(pathlib.Path('health-public-key-v5.json').read_text())
          manifest=json.loads(pathlib.Path('manifest-v5.webmanifest').read_text())
          assert enc['schemaVersion']==2
          assert enc['algorithm']=='RSA-OAEP-256+A256GCM'
          assert enc['compression']=='gzip'
          assert enc['keyId']==pub['keyId']
          assert pub['publicKeyJwk']['kty']=='RSA'
          assert pub['publicKeyJwk']['alg']=='RSA-OAEP-256'
          assert manifest['start_url']=='./?v=5.2'
          assert manifest['icons'][0]['src']=='icon.svg?v=5.2'
          for key in ('wrappedKey','iv','ciphertext'):
              s=enc[key]
              base64.urlsafe_b64decode(s + '='*((4-len(s)%4)%4))
          assert len(enc['plaintextSha256'])==64
          assert enc['plaintextSha256']=='6d45104909cc615d365e0dd5dc6f0802023dec32b2944c305a560899143af785'
          print('encrypted-dataset-contract-v2: PASS')
          PY

      - name: HTML, panorama and service worker contract
        run: |
          python - <<'PY'
          import pathlib, re
          html=pathlib.Path('index.html').read_text()
          required_files=['styles.css','v45.css','v5.css','v51.css','v52.css','core-v5.js','crypto-v5.js','charts-v5.js','render-v5.js','v51.js','v52.js','ui-v5.js','crypto-ui-v5.js','sw-v5.js','manifest-v5.webmanifest','health-data-v5.enc.json']
          for f in required_files:
              assert pathlib.Path(f).exists(), f'missing {f}'
          required_ids=['greeting','privacyState','heroWeight','heroDate','heroBmi','heroFatPct','heroMuscle','weightDelta','overviewChart','overviewLatest','homeInsight','healthGlance','healthDateBase','resultsTimeline','evolutionChart','evoMetricLabel','evoMetricValue','evoMetricDelta','evoReference','healthSummaryDate','healthFreshness','healthSummaryText','healthKpis','healthCategoryTabs','healthMarkers','labMetricLabel','labMetricValue','labMetricDelta','labReference','labContext','labChart','labHistory','reportHistory','examIndexSearch','examIndexFilters','examIndexCount','examIndexList','examIndexMore','clinicalTimeline','bodyDetailDialog','bodyDetailContent','bodyDetailTitle','dataDialog','importInput','recoveryKeyInput','syncBtn','exportBtn','resetBtn','clearKeyBtn']
          for i in required_ids:
              assert re.search(rf'id=["\']{re.escape(i)}["\']',html), f'missing DOM id {i}'
          assert '<span class="version-badge">V5.2</span>' in html
          assert 'A V5.2 publica apenas uma base' in html
          assert html.count('?v=5.2') >= 12
          assert 'v52.css?v=5.2' in html
          assert 'v52.js?v=5.2' in html
          sw=pathlib.Path('sw-v5.js').read_text()
          for f in ['core-v5.js','crypto-v5.js','charts-v5.js','render-v5.js','v51.js','v52.js','ui-v5.js','crypto-ui-v5.js','v51.css','v52.css']:
              assert f in sw, f'{f} not in SW shell'
          assert 'health-data-v5.enc.json' in sw
          assert 'health-tracker-v5-2-shell' in sw
          v51=pathlib.Path('v51.js').read_text()
          v52=pathlib.Path('v52.js').read_text()
          css52=pathlib.Path('v52.css').read_text()
          crypto_ui=pathlib.Path('crypto-ui-v5.js').read_text()
          assert 'openExamIndexBtn' in v51
          assert 'v511SyncSuccessMessage' in v51
          assert 'Sincronizando…' in crypto_ui
          assert 'v511ShowToast' in crypto_ui
          for token in ['V52_SPECIALTIES','openHealthPanoramaBtn','healthPanoramaDialog','v52Panorama','Ver meu panorama de saúde','Ver evidências']:
              assert token in v52, f'missing panorama token {token}'
          assert 'localmente' in v52
          assert "status={code:'attention',label:'Atenção'}" not in v52
          assert "status={code:'priority',label:'Prioridade médica'}" in v52
          assert 'não significa, por si só, urgência ou gravidade' in v52
          assert 'v521HasExplicitPriority' in v52
          assert '.panorama-area.priority' in css52
          assert '.status.monitor' in css52
          print('html-panorama-service-worker-contract-v5.2-calm-severity: PASS')
          PY
