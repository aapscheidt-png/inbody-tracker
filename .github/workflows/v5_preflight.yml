name: V5 Preflight

on:
  push:
    branches:
      - v5-private-data-architecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in core-v5.js crypto-v5.js charts-v5.js render-v5.js ui-v5.js crypto-ui-v5.js sw-v5.js; do
            test -f "$f"
            node --check "$f"
          done

      - name: Privacy invariants
        run: |
          set -euo pipefail
          test ! -e core.js
          test ! -e core-v3.js
          test ! -e health-recovery-key-v5.json
          ! grep -R -n --exclude='health-data-v5.enc.json' --exclude='v5_preflight.yml' -E '287[.]364[.]238|ANDERSON ANDRE PSCHEIDT|BUNDLED_HEALTH_DATA' .

      - name: Encrypted dataset contract
        run: |
          python - <<'PY'
          import base64, json, pathlib
          enc=json.loads(pathlib.Path('health-data-v5.enc.json').read_text())
          pub=json.loads(pathlib.Path('health-public-key-v5.json').read_text())
          manifest=json.loads(pathlib.Path('manifest-v5.webmanifest').read_text())
          assert enc['schemaVersion']==1
          assert enc['algorithm']=='RSA-OAEP-256+A256GCM'
          assert enc['keyId']==pub['keyId']
          assert pub['publicKeyJwk']['kty']=='RSA'
          assert pub['publicKeyJwk']['alg']=='RSA-OAEP-256'
          assert manifest['start_url'].startswith('./')
          for key in ('wrappedKey','iv','ciphertext'):
              s=enc[key]
              base64.urlsafe_b64decode(s + '='*((4-len(s)%4)%4))
          assert len(enc['plaintextSha256'])==64
          print('encrypted-dataset-contract: PASS')
          PY

      - name: HTML and service worker contract
        run: |
          python - <<'PY'
          import pathlib, re
          html=pathlib.Path('index.html').read_text()
          required_files=['styles.css','v45.css','v5.css','core-v5.js','crypto-v5.js','charts-v5.js','render-v5.js','ui-v5.js','crypto-ui-v5.js','sw-v5.js','manifest-v5.webmanifest','health-data-v5.enc.json']
          for f in required_files:
              assert pathlib.Path(f).exists(), f'missing {f}'
          required_ids=['greeting','privacyState','heroWeight','heroDate','heroBmi','heroFatPct','heroMuscle','weightDelta','overviewChart','overviewLatest','homeInsight','healthGlance','healthDateBase','resultsTimeline','evolutionChart','evoMetricLabel','evoMetricValue','evoMetricDelta','evoReference','healthSummaryDate','healthFreshness','healthSummaryText','healthKpis','healthCategoryTabs','healthMarkers','labMetricLabel','labMetricValue','labMetricDelta','labReference','labContext','labChart','labHistory','reportHistory','clinicalTimeline','bodyDetailDialog','bodyDetailContent','bodyDetailTitle','dataDialog','importInput','recoveryKeyInput','syncBtn','exportBtn','resetBtn','clearKeyBtn']
          for i in required_ids:
              assert re.search(rf'id=["\']{re.escape(i)}["\']',html), f'missing DOM id {i}'
          sw=pathlib.Path('sw-v5.js').read_text()
          for f in ['core-v5.js','crypto-v5.js','charts-v5.js','render-v5.js','ui-v5.js','crypto-ui-v5.js']:
              assert f in sw, f'{f} not in SW shell'
          assert 'health-data-v5.enc.json' in sw
          print('html-service-worker-contract: PASS')
          PY
