name: Wealth Intelligence checks
on:
  push:
    branches:
      - main
      - wealth-intelligence-v1
    paths:
      - "wealth-intelligence/**"
      - ".github/workflows/wealth-intelligence-checks.yml"
  pull_request:
    paths:
      - "wealth-intelligence/**"
      - ".github/workflows/wealth-intelligence-checks.yml"
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wealth-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static syntax
        run: |
          node --check engine.js
          node --check importer.js
          node --check performance.js
          node --check analytics.js
          node --check app.js
          node --check server.js
          node --check sw.js
      - name: Finance engine and UI contracts
        run: node --test tests/*.test.cjs
      - name: Production HTTP smoke test
        run: |
          node server.js &
          echo $! > /tmp/wealth_server.pid
          trap 'kill $(cat /tmp/wealth_server.pid) || true' EXIT
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/wealth-health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/wealth-health.json
          curl --fail --silent http://127.0.0.1:3000/ > /tmp/wealth-index.html
          grep -q 'Wealth Intelligence AI' /tmp/wealth-index.html
          for file in app.js engine.js analytics.js performance.js importer.js styles.css sw.js manifest.webmanifest; do
            curl --fail --silent -o /dev/null "http://127.0.0.1:3000/$file"
          done
          echo 'Production HTTP smoke test passed'

