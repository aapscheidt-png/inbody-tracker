name: Wealth Intelligence checks
concurrency:
  group: wealth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
      - research/wealth-data-engine-v2-20261021
      - wealth-intelligence-v1
    paths:
      - "wealth-intelligence/**"
      - ".github/workflows/wealth-intelligence-checks.yml"
  pull_request:
    paths:
      - "wealth-intelligence/**"
      - ".github/workflows/wealth-intelligence-checks.yml"
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wealth-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static syntax
        run: |
          node --check xlsx-engine.js
          node --check ledger.js
          node --check integrity.js
          node --check engine.js
          node --check importer.js
          node --check performance.js
          node --check analytics.js
          node --check app.js
          node --check server.js
          node --check sw.js
      - name: Finance engine and UI contracts
        run: node --test tests/*.test.cjs
      - name: Production HTTP smoke test
        run: |
          node server.js &
          echo $! > /tmp/wealth_server.pid
          trap 'kill $(cat /tmp/wealth_server.pid) || true' EXIT
          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/wealth-health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/wealth-health.json
          curl --fail --silent http://127.0.0.1:3000/ > /tmp/wealth-index.html
          grep -q 'Wealth Intelligence AI' /tmp/wealth-index.html
          for file in app.js engine.js analytics.js performance.js importer.js xlsx-engine.js ledger.js integrity.js styles.css sw.js manifest.webmanifest; do
            curl --fail --silent -o /dev/null "http://127.0.0.1:3000/$file"
          done
          echo 'Production HTTP smoke test passed'

      - name: Package Excel parsing module for private QA
        uses: actions/upload-artifact@v4
        with:
          name: wealth-data-engine-v2-source
          path: wealth-intelligence/xlsx-engine.js
          if-no-files-found: error
  mobile-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wealth-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.56.1
      - name: Mobile browser journey
        run: |
          mkdir -p artifacts
          node server.js &
          echo $! > /tmp/wealth-mobile-server.pid
          trap 'kill $(cat /tmp/wealth-mobile-server.pid) || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
          node tests/mobile.e2e.cjs
      - name: Preserve mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wealth-mobile-e2e
          path: wealth-intelligence/artifacts/*.png
          if-no-files-found: ignore

  published-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [unit, mobile-e2e]
    steps:
      - name: Check Wealth public GitHub Pages route
        run: |
          URL="https://aapscheidt-png.github.io/inbody-tracker/wealth-intelligence"
          for i in {1..25}; do
            code=$(curl --location --silent --show-error --output /tmp/wealth-site.html --write-out '%{http_code}' "$URL/" || true)
            if [ "$code" = "200" ] && grep -q '<title>Wealth Intelligence AI</title>' /tmp/wealth-site.html; then
              echo "Live mobile app verified at $URL/"
              for asset in engine.js analytics.js performance.js importer.js xlsx-engine.js ledger.js integrity.js app.js styles.css manifest.webmanifest sw.js; do
                curl --fail --location --silent --show-error --output /dev/null "$URL/$asset"
              done
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment: HTTP $code (attempt $i/25)"
            sleep 6
          done
          echo "No matching public site after retries." >&2
          exit 1
