function filteredPeriod(rows){if(state.period==='all'||!rows.length)return rows;let cut=new Date((rows.at(-1).date.length===7?rows.at(-1).date+'-15':rows.at(-1).date)+'T12:00:00Z');cut.setUTCMonth(cut.getUTCMonth()-Number(state.period));return rows.filter(r=>new Date((r.date.length===7?r.date+'-15':r.date)+'T12:00:00Z')>=cut)}
function plot(rows,unit,dec){if(!rows.length)return '<p class="empty">Nenhuma medição comparável.</p>';const w=326,h=176,L=43,R=11,T=12,B=30,vs=rows.map(r=>r.v),min=Math.min(...vs),max=Math.max(...vs),pad=Math.max((max-min)*.12,Math.abs(max)*.025,.01),rough=(max-min+2*pad)/4,scale=10**Math.floor(Math.log10(rough)),step=[1,2,2.5,5,10].find(v=>v*scale>=rough)*scale,lo=Math.floor((min-pad)/step)*step,hi=Math.ceil((max+pad)/step)*step;const stamp=r=>Date.parse((r.date.length===7?r.date+'-15':r.date)+'T12:00:00Z'),t0=stamp(rows[0]),t1=stamp(rows.at(-1)),x=r=>t0===t1?(w+L-R)/2:L+(w-L-R)*(stamp(r)-t0)/(t1-t0),y=v=>T+(h-T-B)*(hi-v)/(hi-lo);let svg='';for(let v=hi,i=0;v>=lo-step/2&&i<9;v-=step,i++){const yy=y(v);svg+=`<line x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="2" y="${yy+4}" font-size="10.5" fill="var(--muted)">${nf(Number(v.toPrecision(3)))}</text>`}for(let i=1;i<rows.length;i++){const a=rows[i-1],b=rows[i];const comparable=!a.device&&!b.device||a.device===b.device&&a.device!=='Equipamento não identificado'&&!a.reported&&!b.reported;const weight=state.page==='metric:weightKg';if(comparable||weight)svg+=`<line x1="${x(a)}" x2="${x(b)}" y1="${y(a.v)}" y2="${y(b.v)}" stroke="var(--chart)" stroke-width="2.4" stroke-linecap="round" ${comparable?'':'stroke-dasharray="5 4"'}/>`;}const inds=[0];for(let i=1;i<rows.length-1;i++)if(x(rows[i])-x(rows[inds.at(-1)])>=67&&x(rows.at(-1))-x(rows[i])>=67)inds.push(i);if(rows.length>1&&x(rows.at(-1))-x(rows[0])>=67)inds.push(rows.length-1);svg+=inds.map(i=>`<text x="${x(rows[i])}" y="${h-7}" font-size="10.5" fill="var(--muted)" text-anchor="${i===0?'start':i===rows.length-1?'end':'middle'}">${rows[i].date.slice(5,7)}/${rows[i].date.slice(2,4)}</text>`).join('');svg+=rows.map((r,i)=>`<g class="chartpoint" data-point="${i}" tabindex="0" role="button" aria-label="${esc(date(r.date)+' · '+nf(r.v,dec)+' '+unit)}"><circle class="plot-dot" cx="${x(r)}" cy="${y(r.v)}" r="${i===rows.length-1?5:3.5}" fill="var(--chart)" stroke="var(--surface)" stroke-width="1.4"/><circle cx="${x(r)}" cy="${y(r.v)}" r="14" fill="transparent"/></g>`).join('');let last=rows.at(-1);return `<div class="selection"><span id="pointDate">${date(last.date)}</span><strong id="pointValue">${nf(last.v,dec)} ${esc(unit)}</strong></div><svg id="plot" class="graph" viewBox="0 0 ${w} ${h}" aria-label="Gráfico cronológico; selecione os pontos para consultar valores">${svg}</svg><div class="legend"><i></i> ${esc(unit?'Resultado ('+unit+')':'Resultado')} <span class="hint">Toque nos pontos</span></div>`}
let plotRows=[],plotUnit='',plotDec;
function labOrMetric(e,m){const all=e?e.rows:m.rows;if(!all.length){pageHeader(e?.name||m?.name||'Indicador');return panel('<p class="empty">Ainda não há medições para este indicador.</p>')};let rows=e&&state.year?all.filter(r=>r.date.startsWith(state.year)):all;if(!rows.length)rows=all;const last=rows.at(-1),unit=last.unit||m?.unit||'',dec=m?.dec;pageHeader(e?.name||m.name,e?.cat||'Composição corporal');const ref=m&&Array.isArray(m.ref)?m.ref:e?last.ref:'';const rawRange=e&&last.raw?.reference;const range=Array.isArray(ref)?ref:rawRange&&Number.isFinite(rawRange.min)&&Number.isFinite(rawRange.max)&&rawRange.max>rawRange.min?[rawRange.min,rawRange.max]:null;const change=m?.id==='weightKg'?weightDelta({...m,rows}):'';const same=e?comparableSeries(rows,e.id,last.unit):seriesRows(rows).filter(r=>r.unit===last.unit);plotRows=filteredPeriod(same.filter(r=>r.date));plotUnit=unit;plotDec=dec;return panel(`<p class="meta">Último resultado · ${date(last.date)}</p><div class="resultmain">${esc(valueText(last.v,dec))} <small>${esc(unit)}</small></div>${change?`<p class="trend">${change}</p>`:''}${ref?`<p class="refline">${Array.isArray(ref)?'Referência do último exame: '+nf(ref[0])+' – '+nf(ref[1])+' '+esc(unit):esc(ref)}</p>`:''}${range&&typeof last.v==='number'?`<div class="bar"><span></span><span></span><span></span><i style="left:${25+50*Math.max(0,Math.min(1,(last.v-range[0])/(range[1]-range[0])))}%"></i></div><div class="range-labels"><span>Abaixo</span><span>Na referência</span><span>Acima</span></div>`:''}${e&&last.context?`<p class="small">${esc(last.context)}</p>`:''}<p class="textblock">${esc(e?(last.context?'':'Interprete conforme o laudo e o contexto clínico.'):m?.id==='weightKg'?'Prioridade atual: estabilizar o peso e preservar a massa muscular.':'Acompanhe o indicador junto aos demais dados de composição corporal.')}</p>`,'result-panel')+group('Evolução',panel(`<div class="pills periods">${[['6','6 meses'],['12','1 ano'],['all','Tudo']].map(([v,t])=>`<button class="pill ${state.period===v?'active':''}" data-period="${v}">${t}</button>`).join('')}</div>${plot(plotRows,unit,dec)}${same.length!==rows.length?'<p class="small">Resultados qualitativos ou unidades incompatíveis aparecem somente na tabela.</p>':''}`,'chart-panel'))+group('Histórico',panel(`<table class="table"><thead><tr><th>Data</th><th>Resultado</th>${e?'<th class="doccol">Laudo</th>':''}</tr></thead><tbody>${rows.slice().reverse().map((r,i)=>`<tr><td>${date(r.date)}</td><td>${esc(valueText(r.v,dec))} ${esc(r.unit)}</td>${e?`<td><button class="doc-button" data-open="source:${e.id}:${r.rowId}" aria-label="Documento de ${date(r.date)}">${icon('file')}</button></td>`:''}</tr>`).join('')}</tbody></table>`,'table-panel'),state.year?'<button class="link" data-action="full-year">Todos os anos</button>':`<span class="small">${rows.length} registros</span>`)+(e?group('Arquivo mais recente',panel(sourceHTML(last),'source-panel')):`<details class="disclosure"><summary>Detalhes técnicos dos dados</summary><p>Registros com precisão mensal não têm dia confirmado. A comparação de composição corporal entre equipamentos exige cautela. Dados ausentes são omitidos.</p></details>`)}
function extraPage(p){if(p==='vaccines'){pageHeader('Vacinas','Carteira de vacinação');return panel('<div class="empty-state">'+icon('vaccine')+'<h2>Seu histórico de vacinação</h2><p class="textblock">Aguardando a importação dos seus registros. Nenhuma dose foi cadastrada na base disponível.</p></div>')+group('Estrutura da carteira',panel('<table class="table"><thead><tr><th>Vacina</th><th>Dose</th><th>Data</th></tr></thead><tbody><tr><td colspan="3" class="empty">Sem registros importados</td></tr></tbody></table>','table-panel'))+panel('<p class="textblock">A estrutura permite apresentar doses, datas, comprovantes e reforços indicados pelo profissional de saúde.</p>')}
if(p==='treatments'){pageHeader('Tratamentos','Prescrições e acompanhamento');return group('Histórico de prescrições',`<div class="rows">${(data.treatments||[]).map(t=>`<div class="row static"><span class="rowtext"><strong>${esc(t.title)}</strong><span>${date(t.date)}</span>${t.details?`<span>${esc(typeof t.details==='string'?t.details:JSON.stringify(t.details))}</span>`:''}</span></div>`).join('')}</div>`)+panel('<h3>Medicamentos em uso</h3><p class="textblock">Prescrições antigas não confirmam medicamentos em uso atualmente.</p>')}
if(p==='checkup'){pageHeader('Check-up');const cps=(data.checkups||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));return cps.map(cp=>panel('<h3>'+date(cp.date)+'</h3><p class="textblock">'+(cp.status==='partial'?'Resultados parciais.':'Registros disponíveis.')+'</p>'+EX.filter(e=>e.rows.some(r=>r.date===cp.date)).map(e=>row(e.name,date(cp.date),'',`data-open="exam:${e.id}"`)).join(''))).join('')||panel('<p>Sem check-up catalogado.</p>')}
if(p==='settings'){pageHeader('Configurações');return group('Aparência',panel(`<div class="pills settings-pills">${[['light','Claro'],['dark','Escuro'],['system','Sistema']].map(([v,t])=>`<button class="pill ${theme===v?'active':''}" data-theme="${v}">${t}</button>`).join('')}</div>`))+group('Dados e privacidade',panel(`<div class="source-head">${icon('shield')}<div><strong>Prontuário privado</strong><span class="small">${esc(syncInfo)}</span></div></div><button class="btn secondary" data-action="sync" ${syncing?'disabled':''}>Sincronizar agora</button><label class="btn secondary" style="display:block;margin-top:10px">Importar chave neste navegador<input type="file" id="recoveryInputV7" accept="application/json" style="display:block;max-width:100%;margin-top:8px"></label><p class="small">A chave importada é guardada somente neste navegador após uma sincronização bem-sucedida. Não altera a chave nem os dados salvos pela versão anterior.</p>`))+group('Sobre',panel('<p>Health Tracker · V7.0 prévia integrada</p><p class="small">Auditoria clínica ainda parcial. Os PDFs originais permanecem no iCloud.</p>'))}
if(p.startsWith('area:')){let a=p.slice(5);pageHeader(a,'Exames e laudos');return `<div class="rows">${EX.filter(e=>e.cat===a).map(e=>{let r=e.rows.at(-1);return row(e.name,date(r.date),e.kind==='lab'?valueText(r.v)+' '+r.unit:e.kind==='report'?e.rows.length+' laudo(s)':'Arquivo',`data-open="exam:${e.id}"`)}).join('')}</div>`}
if(p.startsWith('source:')){let [,id,dt]=p.split(':');const e=EX.find(x=>x.id===id),r=e.rows.find(x=>x.rowId===dt);if(!r)return panel('<p>Documento não localizado.</p>');pageHeader(e.name,date(r.date));return panel(`<div class="resultmain">${esc(valueText(r.v))} <small>${esc(r.unit)}</small></div><p class="refline">${esc(r.ref)}</p>${sourceHTML(r)}`)}
return panel('<p>Seção demonstrativa.</p>')}
function bioDetail(e){const b=e.rows[0].raw;pageHeader('Bioimpedância',date(b.date));return group('Resultado',panel(`<table class="table"><thead><tr><th>Indicador</th><th>Valor</th></tr></thead><tbody>${metrics.filter(m=>bodyMetricNumber(b,m.id)!==null).map(m=>`<tr><td><button class="link" data-open="metric:${esc(m.id)}">${esc(m.name)}</button></td><td>${valueText(bodyMetricNumber(b,m.id),m.dec)} ${esc(m.unit)}</td></tr>`).join('')}</tbody></table>`,'table-panel'))+panel(sourceHTML({path:pathFor(b),facility:facFor(b)}));}
function render(reset=true){plotRows=[];let p=state.page,content;if(p?.startsWith('exam:')){let e=EX.find(x=>x.id===p.slice(5));content=!e?panel('<p>Registro não localizado.</p>'):e.kind==='lab'?labOrMetric(e,null):e.kind==='bio'?bioDetail(e):report(e)}else if(p?.startsWith('metric:')){const m=metrics.find(x=>x.id===p.slice(7));content=m?labOrMetric(null,m):panel('<p>Indicador não localizado.</p>');}else if(p)content=extraPage(p);else content=({home,search,bio,care,history}[state.tab])();$('#main').innerHTML=content;$('#nav').innerHTML=tabs.map(([k,t])=>`<button data-nav="${k}" class="${state.tab===k?'active':''}" ${state.tab===k?'aria-current="page"':''}>${icon(k)}<span>${t}</span></button>`).join('');if(state.tab==='search'&&!p){renderResults();$('#query').addEventListener('input',e=>{state.q=e.target.value;renderResults()});$('#year').addEventListener('change',e=>{state.year=e.target.value;renderResults()})}if(p==='settings'){ $('#recoveryInputV7')?.addEventListener('change',async e=>{try{const doc=JSON.parse(await e.target.files[0].text());if(!doc.privateKeyJwk||!doc.keyId)throw Error('Chave inválida');recoverySession=doc;await syncV7();}catch(err){syncInfo=err.message;render(false);}})}if(reset)scrollTop()}
function point(el){let g=el.closest('[data-point]');if(!g||!plotRows.length)return;let r=plotRows[+g.dataset.point];if(!r)return;$$('.plot-dot').forEach(c=>c.setAttribute('r','3.5'));g.querySelector('.plot-dot').setAttribute('r','5.5');$('#pointDate').textContent=date(r.date);$('#pointValue').textContent=nf(r.v,plotDec)+' '+plotUnit;}
document.addEventListener('click',async e=>{let t=e.target.closest('button,[data-point]');if(!t)return;if(t.dataset.nav){go(t.dataset.nav);return}if(t.dataset.open){open(t.dataset.open);return}if(t.dataset.area){open('area:'+t.dataset.area);return}if(t.dataset.kind){state.kind=t.dataset.kind;render(false);return}if(t.dataset.period){state.period=t.dataset.period;render(false);return}if(t.dataset.theme){setTheme(t.dataset.theme);return}if(t.dataset.copy){try{await navigator.clipboard.writeText(t.dataset.copy);t.textContent='Localização copiada'}catch{prompt('Copiar localização',t.dataset.copy)}return}if(t.dataset.point!==undefined){point(t);return}switch(t.dataset.action){case'back':back();break;case'clear':state.q='';state.kind='all';state.year='';render(false);$('#query').focus();break;case'areas-more':state.areasMore=!state.areasMore;render(false);break;case'bio-more':state.bioMore=!state.bioMore;render(false);break;case'full-year':state.year='';render(false);break;case'appearance':$('#appearanceMenu').hidden=!$('#appearanceMenu').hidden;t.setAttribute('aria-expanded',!$('#appearanceMenu').hidden);break;case'settings':open('settings');break;case'sync':syncV7();break;}});
