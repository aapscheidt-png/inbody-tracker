function rxLabelV7(k){
 return ({testosteroneCypionate:'Cipionato de testosterona',formulaMorning:'Fórmula da manhã',sleepFormula:'Fórmula para sono',formulaEvening:'Fórmula da noite',medications:'Medicamentos',supplements:'Suplementação',purpose:'Finalidade registrada',indication:'Indicação registrada',dosage:'Posologia',dose:'Dose',frequency:'Frequência',duration:'Duração',notes:'Observações',instructions:'Orientações',name:'Nome',route:'Via de administração',composition:'Composição'})[k]||String(k).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/[_-]/g,' ').replace(/^./,c=>c.toUpperCase());
}
function rxValueV7(v,depth=0){
 if(v==null||v==='')return '<p class="small">Não informado.</p>';
 if(depth>8)return '<p class="small">Consultar receita original para mais detalhes.</p>';
 if(Array.isArray(v))return '<ul class="rx-items">'+v.map(x=>{
  if(typeof x==='string'){
   const m=x.match(/^(.+?)\s+(\d[\d.,]*\s*(?:mg|mcg|µg|μg|g|UI|IU|mL|ml))$/i);
   return m?`<li class="rx-ingredient"><span>${esc(m[1])}</span><strong>${esc(m[2])}</strong></li>`:`<li>${esc(x)}</li>`;
  }
  return '<li>'+rxValueV7(x,depth+1)+'</li>';
 }).join('')+'</ul>';
 if(typeof v==='object')return '<dl class="rx-fields">'+Object.entries(v).map(([k,x])=>'<dt>'+esc(rxLabelV7(k))+'</dt><dd>'+rxValueV7(x,depth+1)+'</dd>').join('')+'</dl>';
 return '<p class="rx-text">'+esc(v)+'</p>';
}
function rxCompareV7(t){
 const prior=(data.treatments||[]).filter(x=>dateOf(x)&&dateOf(x)<dateOf(t)).sort((a,b)=>dateOf(b).localeCompare(dateOf(a)))[0];
 const now=rxDetailsV7(t),old=rxDetailsV7(prior);
 if(!prior||!now||!old||typeof now!=='object'||typeof old!=='object'||Array.isArray(now)||Array.isArray(old))return '';
 const blocks=[];
 for(const k of ['formulaMorning','formulaEvening','sleepFormula']){
  if(!Array.isArray(now[k])||!Array.isArray(old[k])||!now[k].every(x=>typeof x==='string')||!old[k].every(x=>typeof x==='string'))continue;
  const added=now[k].filter(x=>!old[k].includes(x)),removed=old[k].filter(x=>!now[k].includes(x));
  if(added.length||removed.length)blocks.push('<h4>'+esc(rxLabelV7(k))+'</h4>'+(added.length?'<p class="small">Consta nesta receita e não na anterior:</p>'+rxValueV7(added):'')+(removed.length?'<p class="small">Constava na anterior e não nesta:</p>'+rxValueV7(removed):''));
 }
 if(typeof now.testosteroneCypionate==='string'&&typeof old.testosteroneCypionate==='string'&&now.testosteroneCypionate!==old.testosteroneCypionate)blocks.push('<h4>Cipionato de testosterona</h4><p class="small">Anterior:</p>'+rxValueV7(old.testosteroneCypionate)+'<p class="small">Nesta receita:</p>'+rxValueV7(now.testosteroneCypionate));
 return blocks.length?'<details class="disclosure rx-compare"><summary>Comparar com a prescrição de '+esc(date(dateOf(prior)))+'</summary>'+blocks.join('')+'<p class="small">Comparação textual entre receitas; não confirma início, suspensão ou uso atual.</p></details>':'';
}
function prescriptionV7(i){
 const t=(data.treatments||[])[i];if(!t){pageHeader('Prescrição');return panel('<p>Prescrição não localizada.</p>')}
 pageHeader('Prescrição',date(dateOf(t)));
 const d=rxDetailsV7(t);
 const purpose=t.purpose||t.indication||null;
 let content=panel('<h3>'+esc(t.title||'Prescrição')+'</h3>'+(purpose?'<div class="rx-purpose"><p class="small">Finalidade registrada</p>'+rxValueV7(purpose)+'</div>':'')+'<p class="small">Registro histórico. Uso atual não confirmado.</p>','rx-summary');
 if(d&&typeof d==='object'&&!Array.isArray(d))content+=Object.entries(d).map(([k,v])=>group(esc(rxLabelV7(k)),panel(rxValueV7(v),'rx-panel'))).join('');
 else content+=group('Conteúdo registrado',panel(rxValueV7(d),'rx-panel'));
 return content+rxCompareV7(t)+group('Receita original',panel(sourceHTML({path:pathFor(t),facility:facFor(t)}),'source-panel'));
}
function auditPageV7(){
 pageHeader('Integridade dos dados','Verificação técnica local');
 const n=loadedCountsV7();
 const indexed=EX.filter(e=>e.kind==='lab').reduce((a,e)=>a+e.rows.length,0);
 const discoverable=EX.filter(e=>rank(e,e.name)>=0).length;
 const missingDate=(data.laboratoryResults||[]).filter(r=>!Number.isFinite(calendarStampV7(dateOf(r)))).length;
 const missingSource=(data.laboratoryResults||[]).filter(r=>!pathFor(r)).length;
 const status=syncVerifiedAt&&!syncFailed?(offlineVerifiedV7?'Cópia offline: dois pacotes verificados nesta sessão (SHA-256 e AES-GCM).':'Dois pacotes verificados nesta sessão (SHA-256 e AES-GCM).'):'Sincronize para verificar os dois pacotes publicados.';
 const stats=[['Resultados laboratoriais',n.labs],['Resultados no índice',indexed],['Laudos',n.reports],['Bioimpedâncias',n.bio],['Itens localizáveis pelo próprio nome',discoverable+' / '+EX.length],['Resultados sem data válida',missingDate],['Resultados sem localização',missingSource]];
 return panel('<h3>Verificação técnica</h3><p class="textblock">'+esc(status)+'</p><p class="small">Não equivale à conferência de cada resultado com o PDF original.</p>')+group('Conferência do índice',panel('<table class="table"><tbody>'+stats.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+esc(v)+'</td></tr>').join('')+'</tbody></table>','table-panel'))+group('Conciliação de resultados',panel(mergeDifferencesV7===null?'<p class="textblock">Ainda não comparado nesta sessão.</p>':('<p class="textblock">'+mergeDifferencesV7.length+' registros da atualização com valor ou unidade diferente do registro anterior de mesma data e exame.</p><p class="small">Não são necessariamente erros clínicos. A base anterior foi preservada; confira os documentos antes de alterar valores.</p>'+mergeDifferencesV7.map(({prior,incoming})=>'<details class="disclosure"><summary>'+esc(incoming.label||incoming.key)+' · '+esc(date(dateOf(incoming)))+'</summary><p class="small">Base anterior: '+esc(valueText(prior.value))+' '+esc(prior.unit)+'</p>'+sourceHTML({path:pathFor(prior),facility:facFor(prior)})+'<p class="small">Atualização: '+esc(valueText(incoming.value))+' '+esc(incoming.unit)+'</p>'+sourceHTML({path:pathFor(incoming),facility:facFor(incoming)})+'</details>').join(''))));
}
function extraPage(p){if(p==='audit')return auditPageV7();if(p.startsWith('rx:'))return prescriptionV7(Number(p.slice(3)));if(p==='vaccines'){pageHeader('Vacinas','Carteira de vacinação');return panel('<div class="empty-state">'+icon('vaccine')+'<h2>Seu histórico de vacinação</h2><p class="textblock">Aguardando a importação dos seus registros. Nenhuma dose foi cadastrada na base disponível.</p></div>')+group('Estrutura da carteira',panel('<table class="table"><thead><tr><th>Vacina</th><th>Dose</th><th>Data</th></tr></thead><tbody><tr><td colspan="3" class="empty">Sem registros importados</td></tr></tbody></table>','table-panel'))+panel('<p class="textblock">A estrutura permite apresentar doses, datas, comprovantes e reforços indicados pelo profissional de saúde.</p>')}
if(p==='treatments'){pageHeader('Tratamentos','Prescrições e acompanhamento');const ts=(data.treatments||[]).map((t,i)=>({t,i})).sort((a,b)=>dateOf(b.t).localeCompare(dateOf(a.t)));return group('Histórico de prescrições',ts.length?'<div class="rows">'+ts.map(({t,i})=>row(t.title||'Prescrição',date(dateOf(t)),'',`data-open="rx:${i}"`)).join('')+'</div>':panel('<p class="empty">Nenhuma prescrição registrada.</p>'))+panel('<h3>Medicamentos em uso</h3><p class="textblock">Aguardando confirmação do tratamento atual. As receitas anteriores estão disponíveis no histórico.</p>','rx-summary')}
if(p==='checkup'){pageHeader('Check-up');const cps=(data.checkups||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));return cps.map(cp=>panel('<h3>'+date(cp.date)+'</h3><p class="textblock">'+(cp.status==='partial'?'Resultados parciais.':'Registros disponíveis.')+'</p>'+EX.filter(e=>e.rows.some(r=>r.date===cp.date)).map(e=>row(e.name,date(cp.date),'',`data-open="exam:${e.id}"`)).join(''))).join('')||panel('<p>Sem check-up catalogado.</p>')}
if(p==='settings'){pageHeader('Configurações');return group('Aparência',panel(`<div class="pills settings-pills">${[['light','Claro'],['dark','Escuro'],['system','Sistema']].map(([v,t])=>`<button class="pill ${theme===v?'active':''}" data-theme="${v}">${t}</button>`).join('')}</div>`))+group('Dados e privacidade',panel(`<div class="source-head">${icon('shield')}<div><strong>Prontuário privado</strong><span class="small">${esc(syncInfo)}</span></div></div><button class="btn secondary" data-action="sync" ${syncing?'disabled':''}>Sincronizar agora</button><label class="btn secondary" style="display:block;margin-top:10px">Importar chave neste navegador<input type="file" id="recoveryInputV7" accept="application/json" style="display:block;max-width:100%;margin-top:8px"></label><p class="small">A chave importada é guardada somente neste navegador após uma sincronização bem-sucedida. Não altera a chave nem os dados salvos pela versão anterior.</p>`))+group('Verificação técnica',panel('<button class="link" data-open="audit">Conferir integridade e registros ›</button>'))+group('Sobre',panel('<p>Health Tracker · V7.0.6 · versão para homologação final</p><p class="small">Auditoria clínica ainda parcial. Os PDFs originais permanecem no iCloud.</p>'))}
if(p.startsWith('area:')){let a=p.slice(5);pageHeader(a,'Exames e laudos');return `<div class="rows">${EX.filter(e=>e.cat===a).map(e=>{let r=e.rows.at(-1);return row(e.name,date(r.date),e.kind==='lab'?valueText(r.v)+' '+r.unit:e.kind==='report'?e.rows.length+' laudo(s)':'Arquivo',`data-open="exam:${e.id}"`)}).join('')}</div>`}
if(p.startsWith('source:')){let [,id,dt]=p.split(':');const e=EX.find(x=>x.id===id),r=e?.rows.find(x=>x.rowId===dt);if(!r)return panel('<p>Documento não localizado.</p>');pageHeader(e.name,date(r.date));return panel(`<div class="resultmain">${esc(valueText(r.v))} <small>${esc(r.unit)}</small></div><p class="refline">${esc(r.ref)}</p>${sourceHTML(r)}`)}
return panel('<p>Seção demonstrativa.</p>')}
function bioDetail(e){const b=e.rows[0].raw;pageHeader('Bioimpedância',date(b.date));return group('Resultado',panel(`<table class="table"><thead><tr><th>Indicador</th><th>Valor</th></tr></thead><tbody>${metrics.filter(m=>bodyMetricNumber(b,m.id)!==null).map(m=>`<tr><td><button class="link" data-open="metric:${esc(m.id)}">${esc(m.name)}</button></td><td>${valueText(bodyMetricNumber(b,m.id),m.dec)} ${esc(m.unit)}</td></tr>`).join('')}</tbody></table>`,'table-panel'))+panel(sourceHTML({path:pathFor(b),facility:facFor(b)}));}
function render(reset=true){closeAppearance();updateAppearance();plotRows=[];let p=state.page,content;if(p?.startsWith('exam:')){let e=EX.find(x=>x.id===p.slice(5));content=!e?panel('<p>Registro não localizado.</p>'):e.kind==='lab'?labOrMetric(e,null):e.kind==='bio'?bioDetail(e):report(e)}else if(p?.startsWith('metric:')){const m=metrics.find(x=>x.id===p.slice(7));content=m?labOrMetric(null,m):panel('<p>Indicador não localizado.</p>');}else if(p)content=extraPage(p);else content=({home,search,bio,care,history}[state.tab])();$('#main').innerHTML=content;$('#nav').innerHTML=tabs.map(([k,t])=>`<button data-nav="${k}" class="${state.tab===k?'active':''}" ${state.tab===k?'aria-current="page"':''}>${icon(k)}<span>${t}</span></button>`).join('');if(state.tab==='search'&&!p){renderResults();$('#query').addEventListener('input',e=>{state.q=e.target.value;renderResults()});$('#year').addEventListener('change',e=>{state.year=e.target.value;renderResults()})}if(p==='settings'){ $('#recoveryInputV7')?.addEventListener('change',async e=>{try{const doc=JSON.parse(await e.target.files[0].text());if(!doc.privateKeyJwk||!doc.keyId)throw Error('Chave inválida');recoverySession=doc;await syncV7();}catch(err){syncInfo=err.message;render(false);}})}if(reset)scrollTop()}
function point(el){
 const g=el.closest('[data-point]');if(!g)return;
 const r=plotRows[+g.dataset.point],box=g.closest('.chart-unit');if(!r||!box)return;
 box.querySelectorAll('.plot-dot').forEach(c=>c.setAttribute('r','3.5'));
 g.querySelector('.plot-dot')?.setAttribute('r','5.5');
 box.querySelector('[data-point-date]').textContent=date(r.date);
 box.querySelector('[data-point-value]').textContent=valueText(r.v,r.chartDec)+' '+r.chartUnit;
}
document.addEventListener('click',async e=>{if(!e.target.closest('#appearanceMenu,#themeButton'))closeAppearance();let t=e.target.closest('button,[data-point]');if(!t)return;if(t.dataset.nav){go(t.dataset.nav);return}if(t.dataset.open){open(t.dataset.open);return}if(t.dataset.area){open('area:'+t.dataset.area);return}if(t.dataset.kind){state.kind=t.dataset.kind;render(false);return}if(t.dataset.period){state.period=t.dataset.period;render(false);return}if(t.dataset.theme){setTheme(t.dataset.theme);return}if(t.dataset.copy){try{await navigator.clipboard.writeText(t.dataset.copy);t.textContent='Localização copiada'}catch{prompt('Copiar localização',t.dataset.copy)}return}if(t.dataset.point!==undefined){point(t);return}switch(t.dataset.action){case'back':back();break;case'clear':state.q='';state.kind='all';state.year='';render(false);$('#query').focus();break;case'areas-more':state.areasMore=!state.areasMore;render(false);break;case'bio-more':state.bioMore=!state.bioMore;render(false);break;case'full-year':state.year='';render(false);break;case'appearance':updateAppearance();$('#appearanceMenu').hidden=!$('#appearanceMenu').hidden;t.setAttribute('aria-expanded',String(!$('#appearanceMenu').hidden));break;case'settings':open('settings');break;case'sync':syncV7();break;}});
document.addEventListener('keydown',e=>{if(e.target.closest('[data-point]')&&['Enter',' '].includes(e.key)){e.preventDefault();point(e.target)}if(e.key==='Escape')closeAppearance()});hydrate();applyTheme();render();if(previewRecoveryV7())syncV7();

})();
</script></body></html>
